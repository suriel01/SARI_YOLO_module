services:
  modulo_ojo:
    build: .
    container_name: modulo_ojo
    restart: unless-stopped
    runtime: nvidia # Habilita el runtime de NVIDIA para acceso a la GPU
    ports:
      - "8080:8080" # Authenticated MJPEG/snapshot server (EYES_STREAM_TOKEN)
    env_file:
      - .env # local only, never committed; template in .env.example
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
    # Runs as the unprivileged `sari` user (uid 10001): `sudo chown -R 10001:10001 model_cache alert_queue`
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./model_cache:/app/model_cache # Para cachear yolo26n.engine y no recompilar
      - ./alert_queue:/app/alert_queue # persistent undelivered alerts (survives restarts)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
